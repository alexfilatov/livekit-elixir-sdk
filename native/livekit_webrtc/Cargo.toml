[package]
name = "livekit_webrtc"
version = "0.1.0"
edition = "2021"

[lib]
name = "livekit_webrtc"
crate-type = ["cdylib"]

[dependencies]
rustler = "0.37"
livekit = "0.7"
# Direct dependency purely so the crypto provider can be installed at NIF
# load. Cargo unifies this with the rustls that livekit already pulls in, so
# the provider is installed on the same instance the HTTP client uses.
rustls = { version = "0.23", default-features = false, features = ["ring"] }
# So the Rust side can be made to talk. livekit and reqwest both emit
# `tracing` events; without a subscriber they go nowhere, and a failure deep
# in the client surfaces to Elixir as one line with no cause attached.
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
once_cell = "1"
tokio = { version = "1", features = ["full"] }
futures = "0.3"
